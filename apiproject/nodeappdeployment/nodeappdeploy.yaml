apiVersion: apps/v1
kind: Deployment
metadata:
  name: avengers-api
  namespace: avengers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: avengers-api
  template:
    metadata:
      labels:
        app: avengers-api
    spec:
      containers:
      - name: avengers-api
        image: mydevopsuser46/marvelapiproject:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: MONGO_USER
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: username
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: password
        - name: MONGO_HOST
          value: "mongo-service"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 15
